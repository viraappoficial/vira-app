<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Vira</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#14161C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vira" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Evita zoom por duplo toque/pinça — o app já se ajusta à tela sozinho. */
        touch-action: manipulation;
        /* Sem isso, qualquer área não coberta pelo app (ex: atrás do indicador
           de home no iOS) aparece branca por padrão do navegador. */
        background-color: #14161c;
      }
      /* No PWA instalado no iOS (modo standalone/fullscreen), 100% pode ficar maior
         que a área visível de verdade — 100dvh acompanha a altura visível real. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
